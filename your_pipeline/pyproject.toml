[project]
name = "ekz-repricing-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "SQLAlchemy>=2.0.30",
  "prefect>=2.16.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["your_pipeline/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
